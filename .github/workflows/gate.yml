name: gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/pmanager/skills/pmanager
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: bun run gate

  bench-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: bun run gate
      - name: Tool microbench
        run: |
          bun run bench.ts tool --iterations 3 --history /tmp/h.jsonl --report /tmp/BENCH.md | tee /tmp/tool.txt
          { echo '### Tool microbench (median/max ms)'; echo; echo '```'; cat /tmp/tool.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
