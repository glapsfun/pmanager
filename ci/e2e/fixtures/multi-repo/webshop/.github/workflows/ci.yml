name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: make test
      - run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.61.0
      - run: make lint
